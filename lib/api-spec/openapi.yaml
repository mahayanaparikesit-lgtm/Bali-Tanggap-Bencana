openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sistem Koordinasi Bencana Bali API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: laporan
    description: Laporan bencana
  - name: relawan
    description: Manajemen relawan
  - name: inventaris
    description: Inventaris barang donasi
  - name: penugasan
    description: Penugasan relawan
  - name: kebutuhan
    description: Kebutuhan per laporan
  - name: donasi
    description: Donasi dana & barang
  - name: dashboard
    description: Dashboard statistik
  - name: uploads
    description: Unggah berkas (foto laporan, foto KTP)

paths:
  /uploads:
    post:
      operationId: uploadFiles
      tags: [uploads]
      summary: Unggah satu atau beberapa foto (publik — dipakai alur lapor darurat tanpa akun)
      description: >
        multipart/form-data dengan field `files` (bisa diulang untuk beberapa
        berkas, maks. 6). Diimplementasikan lewat fetch manual di klien (bukan
        client generated ini) karena skema binary/multipart tidak digenerate
        Orval dengan bersih — lihat `src/lib/upload.ts` di web & mobile.
      responses:
        "200":
          description: URL berkas yang berhasil diunggah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Berkas tidak valid (bukan gambar / terlalu besar)

  /uploads/ktp:
    post:
      operationId: uploadKtp
      tags: [uploads]
      summary: Unggah satu foto KTP ke bucket PRIVAT (S4)
      description: >
        multipart/form-data dengan field `file` (satu berkas). Mengembalikan
        `path` (bukan URL) untuk dikirim sebagai `foto_ktp_path`. File hanya
        bisa dibuka admin lewat signed URL. Fetch manual di klien, sama seperti /uploads.
      responses:
        "200":
          description: Path objek di bucket privat
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path:
                    type: string
        "400":
          description: Berkas tidak valid

  /laporan/saya:
    get:
      operationId: getLaporanSaya
      tags: [laporan]
      summary: Riwayat laporan milik akun yang sedang login (S10), termasuk yang masih menunggu
      responses:
        "200":
          description: Daftar laporan milik pengguna, terbaru dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Laporan"
        "401":
          description: Belum login

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /laporan:
    get:
      operationId: getLaporan
      tags: [laporan]
      summary: Daftar semua laporan bencana
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [menunggu, terverifikasi, selesai]
        - name: jenis_bencana
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daftar laporan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Laporan"
    post:
      operationId: createLaporan
      tags: [laporan]
      summary: Buat laporan bencana baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaporanInput"
      responses:
        "201":
          description: Laporan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Laporan"

  /laporan/{id}:
    get:
      operationId: getLaporanById
      tags: [laporan]
      summary: Detail laporan bencana
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detail laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaporanDetail"
        "404":
          description: Laporan tidak ditemukan
    patch:
      operationId: updateLaporan
      tags: [laporan]
      summary: Update laporan (verifikasi admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaporanUpdate"
      responses:
        "200":
          description: Laporan diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Laporan"

  /laporan/{id}/kebutuhan:
    get:
      operationId: getKebutuhanByLaporan
      tags: [kebutuhan]
      summary: Daftar kebutuhan per laporan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daftar kebutuhan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kebutuhan"
    post:
      operationId: createKebutuhan
      tags: [kebutuhan]
      summary: Tambah kebutuhan ke laporan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KebutuhanInput"
      responses:
        "201":
          description: Kebutuhan berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kebutuhan"

  /kebutuhan/{id}:
    patch:
      operationId: updateKebutuhan
      tags: [kebutuhan]
      summary: Update progress kebutuhan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KebutuhanUpdate"
      responses:
        "200":
          description: Kebutuhan diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kebutuhan"

  /relawan:
    get:
      operationId: getRelawan
      tags: [relawan]
      summary: Daftar relawan
      parameters:
        - name: status_verifikasi
          in: query
          schema:
            type: string
            enum: [menunggu, terverifikasi, ditolak]
      responses:
        "200":
          description: Daftar relawan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relawan"
    post:
      operationId: createRelawan
      tags: [relawan]
      summary: Daftar sebagai relawan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelawanInput"
      responses:
        "201":
          description: Pendaftaran relawan berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relawan"

  /relawan/{id}:
    get:
      operationId: getRelawanById
      tags: [relawan]
      summary: Detail relawan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detail relawan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relawan"

  /relawan/{id}/verifikasi:
    patch:
      operationId: verifikasiRelawan
      tags: [relawan]
      summary: Verifikasi relawan oleh admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifikasiRelawanInput"
      responses:
        "200":
          description: Status verifikasi diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relawan"

  /inventaris:
    get:
      operationId: getInventaris
      tags: [inventaris]
      summary: Daftar inventaris barang donasi
      parameters:
        - name: kategori
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daftar inventaris
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inventaris"
    post:
      operationId: createInventaris
      tags: [inventaris]
      summary: Tambah barang ke inventaris
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventarisInput"
      responses:
        "201":
          description: Barang berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventaris"

  /inventaris/{id}:
    patch:
      operationId: updateInventaris
      tags: [inventaris]
      summary: Update barang inventaris
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventarisUpdate"
      responses:
        "200":
          description: Inventaris diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventaris"

  /inventaris/{id}/transaksi:
    post:
      operationId: createTransaksiInventaris
      tags: [inventaris]
      summary: Catat transaksi barang masuk/keluar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransaksiInventarisInput"
      responses:
        "201":
          description: Transaksi berhasil dicatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransaksiInventaris"

  /inventaris/{id}/transaksi-list:
    get:
      operationId: getTransaksiByInventaris
      tags: [inventaris]
      summary: Riwayat transaksi per barang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daftar transaksi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransaksiInventaris"

  /penugasan:
    get:
      operationId: getPenugasan
      tags: [penugasan]
      summary: Daftar penugasan relawan
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [aktif, selesai, dibatalkan]
        - name: relawan_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daftar penugasan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Penugasan"
    post:
      operationId: createPenugasan
      tags: [penugasan]
      summary: Buat penugasan relawan baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PenugasanInput"
      responses:
        "201":
          description: Penugasan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Penugasan"

  /penugasan/{id}:
    patch:
      operationId: updatePenugasan
      tags: [penugasan]
      summary: Update status penugasan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PenugasanUpdate"
      responses:
        "200":
          description: Penugasan diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Penugasan"

  /donasi:
    get:
      operationId: getDonasi
      tags: [donasi]
      summary: Daftar semua donasi dana & barang (admin)
      responses:
        "200":
          description: Daftar donasi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donasi"

  /donasi/{id}:
    patch:
      operationId: updateDonasi
      tags: [donasi]
      summary: Konfirmasi/tolak donasi oleh admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonasiUpdate"
      responses:
        "200":
          description: Donasi diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donasi"
        "404":
          description: Donasi tidak ditemukan

  /dashboard/statistik:
    get:
      operationId: getDashboardStatistik
      tags: [dashboard]
      summary: Statistik dashboard admin
      responses:
        "200":
          description: Statistik platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatistik"

  /laporan/aktif:
    get:
      operationId: getLaporanAktif
      tags: [laporan]
      summary: Laporan aktif yang perlu penanganan
      responses:
        "200":
          description: Daftar laporan aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaporanRingkas"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UploadResult:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string

    Laporan:
      type: object
      required: [id, judul, jenis_bencana, lokasi, deskripsi, nama_pelapor, kontak_pelapor, status, created_at]
      properties:
        id:
          type: integer
        judul:
          type: string
        jenis_bencana:
          type: string
          enum: [banjir, gempa_bumi, tanah_longsor, kebakaran, angin_kencang, tsunami, lainnya]
        lokasi:
          type: string
        koordinat_lat:
          type: ["number", "null"]
        koordinat_lng:
          type: ["number", "null"]
        deskripsi:
          type: string
        nama_pelapor:
          type: string
        kontak_pelapor:
          type: string
        jabatan_pelapor:
          type: ["string", "null"]
        jumlah_terdampak:
          type: ["integer", "null"]
        terdampak_pria:
          type: integer
        terdampak_wanita:
          type: integer
        terdampak_anak:
          type: integer
        terdampak_balita:
          type: integer
        terdampak_lansia:
          type: integer
        lokasi_pengungsian:
          type: ["string", "null"]
        foto_urls:
          type: array
          items:
            type: string
        foto_ktp_url:
          type: ["string", "null"]
        foto_ktp_path:
          type: ["string", "null"]
        foto_ktp_signed_url:
          type: ["string", "null"]
          description: Hanya untuk admin — tautan sementara (10 menit) ke foto KTP di bucket privat.
        user_id:
          type: ["integer", "null"]
        kronologi:
          type: ["string", "null"]
        target_dana:
          type: ["integer", "null"]
        status:
          type: string
          enum: [menunggu, terverifikasi, selesai]
        catatan_admin:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    LaporanDetail:
      type: object
      required: [id, judul, jenis_bencana, lokasi, deskripsi, nama_pelapor, kontak_pelapor, status, created_at, kebutuhan, penugasan]
      properties:
        id:
          type: integer
        judul:
          type: string
        jenis_bencana:
          type: string
        lokasi:
          type: string
        koordinat_lat:
          type: ["number", "null"]
        koordinat_lng:
          type: ["number", "null"]
        deskripsi:
          type: string
        nama_pelapor:
          type: string
        kontak_pelapor:
          type: string
        jabatan_pelapor:
          type: ["string", "null"]
        jumlah_terdampak:
          type: ["integer", "null"]
        terdampak_pria:
          type: integer
        terdampak_wanita:
          type: integer
        terdampak_anak:
          type: integer
        terdampak_balita:
          type: integer
        terdampak_lansia:
          type: integer
        lokasi_pengungsian:
          type: ["string", "null"]
        foto_urls:
          type: array
          items:
            type: string
        foto_ktp_url:
          type: ["string", "null"]
        foto_ktp_path:
          type: ["string", "null"]
        foto_ktp_signed_url:
          type: ["string", "null"]
          description: Hanya untuk admin — tautan sementara (10 menit) ke foto KTP di bucket privat.
        user_id:
          type: ["integer", "null"]
        kronologi:
          type: ["string", "null"]
        target_dana:
          type: ["integer", "null"]
        status:
          type: string
        catatan_admin:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]
        kebutuhan:
          type: array
          items:
            $ref: "#/components/schemas/Kebutuhan"
        penugasan:
          type: array
          items:
            $ref: "#/components/schemas/Penugasan"

    LaporanRingkas:
      type: object
      required: [id, judul, jenis_bencana, lokasi, status, created_at, jumlah_kebutuhan_pending]
      properties:
        id:
          type: integer
        judul:
          type: string
        jenis_bencana:
          type: string
        lokasi:
          type: string
        status:
          type: string
        jumlah_terdampak:
          type: ["integer", "null"]
        created_at:
          type: string
        jumlah_kebutuhan_pending:
          type: integer

    # Dipakai POST /laporan yang publik (tanpa login) — semua batas di bawah
    # sengaja ketat. URL foto juga dicek asal bucket-nya di route (butuh env).
    LaporanInput:
      type: object
      required: [judul, jenis_bencana, lokasi, deskripsi, nama_pelapor, kontak_pelapor]
      properties:
        judul:
          type: string
          minLength: 1
          maxLength: 200
        jenis_bencana:
          type: string
          enum: [banjir, gempa_bumi, tanah_longsor, kebakaran, angin_kencang, tsunami, lainnya]
        lokasi:
          type: string
          minLength: 1
          maxLength: 300
        koordinat_lat:
          type: ["number", "null"]
          minimum: -90
          maximum: 90
        koordinat_lng:
          type: ["number", "null"]
          minimum: -180
          maximum: 180
        deskripsi:
          type: string
          minLength: 1
          maxLength: 5000
        nama_pelapor:
          type: string
          minLength: 1
          maxLength: 100
        kontak_pelapor:
          type: string
          minLength: 6
          maxLength: 30
        jabatan_pelapor:
          type: ["string", "null"]
          maxLength: 100
        jumlah_terdampak:
          type: ["integer", "null"]
          minimum: 0
          maximum: 1000000
          multipleOf: 1
        lokasi_pengungsian:
          type: ["string", "null"]
          maxLength: 300
        terdampak_pria:
          type: integer
          minimum: 0
          maximum: 100000
          multipleOf: 1
        terdampak_wanita:
          type: integer
          minimum: 0
          maximum: 100000
          multipleOf: 1
        terdampak_anak:
          type: integer
          minimum: 0
          maximum: 100000
          multipleOf: 1
        terdampak_balita:
          type: integer
          minimum: 0
          maximum: 100000
          multipleOf: 1
        terdampak_lansia:
          type: integer
          minimum: 0
          maximum: 100000
          multipleOf: 1
        foto_urls:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500
        foto_ktp_path:
          type: ["string", "null"]
          maxLength: 200
          pattern: '^ktp/[0-9a-f-]{36}\.(jpg|png|webp|heic|heif)$'
          description: Hasil POST /uploads/ktp (bucket privat). foto_ktp_url publik tidak lagi diterima.

    LaporanUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [menunggu, terverifikasi, selesai]
        catatan_admin:
          type: ["string", "null"]
        lokasi_pengungsian:
          type: ["string", "null"]
        kronologi:
          type: ["string", "null"]
        target_dana:
          type: ["integer", "null"]

    Kebutuhan:
      type: object
      required: [id, laporan_id, kategori, nama_item, jumlah_dibutuhkan, jumlah_terpenuhi, satuan, created_at]
      properties:
        id:
          type: integer
        laporan_id:
          type: integer
        kategori:
          type: string
          enum: [pangan, sandang, medis, tempat_tinggal, air_bersih, lainnya]
        nama_item:
          type: string
        jumlah_dibutuhkan:
          type: integer
        jumlah_terpenuhi:
          type: integer
        satuan:
          type: string
        keterangan:
          type: ["string", "null"]
        created_at:
          type: string

    KebutuhanInput:
      type: object
      required: [kategori, nama_item, jumlah_dibutuhkan, satuan]
      properties:
        kategori:
          type: string
          enum: [pangan, sandang, medis, tempat_tinggal, air_bersih, lainnya]
        nama_item:
          type: string
          minLength: 1
          maxLength: 120
        jumlah_dibutuhkan:
          type: integer
          minimum: 1
          maximum: 1000000
          multipleOf: 1
        satuan:
          type: string
          minLength: 1
          maxLength: 30
        keterangan:
          type: ["string", "null"]
          maxLength: 1000

    KebutuhanUpdate:
      type: object
      properties:
        jumlah_terpenuhi:
          type: integer
        keterangan:
          type: ["string", "null"]

    Relawan:
      type: object
      required: [id, nama, nik, no_hp, alamat, keahlian, status_verifikasi, created_at]
      properties:
        id:
          type: integer
        nama:
          type: string
        nik:
          type: string
        no_hp:
          type: string
        email:
          type: ["string", "null"]
        alamat:
          type: string
        keahlian:
          type: array
          items:
            type: string
        foto_ktp_url:
          type: ["string", "null"]
        foto_ktp_path:
          type: ["string", "null"]
        foto_ktp_signed_url:
          type: ["string", "null"]
        status_verifikasi:
          type: string
          enum: [menunggu, terverifikasi, ditolak]
        catatan_verifikasi:
          type: ["string", "null"]
        created_at:
          type: string

    RelawanInput:
      type: object
      required: [nama, nik, no_hp, alamat, keahlian]
      properties:
        nama:
          type: string
